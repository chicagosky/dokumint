{% load document_tags %}

<div class="row mt-3">
    <div class="d-none d-md-block col-md-1 text-center">
        {% document_favorite document %}
    </div>
    <div class="d-none d-md-block col-md-3">
        {{ transaction_date|date:"D, d M Y" }}
    </div>
    <div class="col-6 d-md-block col-md-5 text-ellipsis">
        <a href="{% url 'core:document_detail' id %}">
            {{ creator_name }}</a>&nbsp;&nbsp;
    </div>
    <div class="col-6 d-md-block col-md-3 text-center">
        <span class="badge text-bg-light border text-secondary" data-bs-toggle="tooltip"
            data-bs-title="Expense Document" data-bs-placement="bottom">
            <a href="{% url 'core:document-image' id %}">
                <i class="bi bi-receipt"></i>
            </a>
            {{ type }}
        </span>
        <span class="badge text-bg-light border text-primary">
            <i class="bi bi-card-list"></i>&nbsp; {{ item_count }}
        </span>
        <span class="badge text-bg-light border text-success">
            <i class="bi bi-cash"></i>&nbsp;$ {{ total }}
        </span>
    </div>
</div>
