<div class='row mb-2'>
    <div class='col-12'>
        <span class="text-black h4" >Personal Information</span>
        &nbsp;&nbsp;
        <span data-bs-toggle="modal" data-bs-target="#edit-profile-modal">
            <i class="bi bi-pencil-square" id="edit-profile-btn"></i>
        </span>
    </div>
</div>

<div class="card shadow mb-4">
    <div class="card-body">
        <div class="container main-body">
            <form method="POST" id="profile-edit-form">
            {% csrf_token %}
            <div class='row'>
                <div class="col-1">
                    <i class="bi bi-person-lines-fill"></i>
                </div>
                <div class="col-11">
                    <div class="row">
                        <div class="col-12">
                            <h5>Full Name:</h5>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <span class="profile-item" class="first-name">
                                {{ user.first_name }} 
                            </span>
                            <span class="profile-item" id='last-name'>
                                {{ user.last_name }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <hr>
            <div class='row'>
                <div class="col-1">
                    <i class="bi bi-envelope-at"></i>
                </div>
                <div class="col-11">
                    <div class="row">
                        <div class="col-12">
                            <h5>Email:</h5>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            {{ user.email }}
                        </div>
                    </div>
                </div>
            </div>
            <hr>
            <div class='row'>
                <div class="col-1">
                    <i class="bi bi-key-fill"></i>
                </div>
                <div class="col-11">
                    <div class="row">
                        <div class="col-12">
                            <h5>Password:</h5>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            *******  
                            <a href="#" data-bs-toggle="modal" data-bs-target="#change-password-modal">
                                Change Password
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <hr>
            <div class='row'>
                <div class="col-1">
                    <i class="bi bi-geo-alt-fill"></i>
                </div>
                <div class="col-11">
                    <div class="row">
                        <div class="col-12">
                            <h5>Zipcode:</h5>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            {{ profile.postal_code }}
                        </div>
                    </div>
                </div>
            </div>
            </form>
        </div>
    </div>
</div>
