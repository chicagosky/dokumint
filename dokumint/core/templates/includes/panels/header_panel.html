{% load static %}
<header>
    <nav class="navbar navbar-expand-sm bg-body-tertiary">
        <div class="container-fluid mx-3">
            <span class="navbar-brand mb-0 h1">
                <img  src="{% static 'img/dokumint_banner_1x.png' %}" alt="" height="30">
            </span>
    
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item ms-2" data-bs-toggle="tooltip" data-bs-title="Home" data-bs-placement="bottom">
                        <a class="nav-link" href="{% url 'core:documents' %}">
                            <i class="bi bi-house larger-icon"></i>
                            <span class="d-md-none ms-2">Home</span>
                        </a>
                    </li>
                    {% if request.user.is_authenticated %}
                    <li class="nav-item ms-2">
                        <a class="nav-link" href="{% url 'core:account-profile' request.user.id %}">
                            <i class="bi bi-person-circle larger-icon" data-bs-toggle="tooltip" data-bs-title="Profile" data-bs-placement="bottom"></i>
                            <span class="d-md-none ms-2">Profile</span>
                        </a>
                    </li>
                    <li class="nav-item ms-2">
                        <a class="nav-link" href="#" onclick="javascript:logout();">
                            <i class="bi bi-door-closed larger-icon" data-bs-toggle="tooltip" data-bs-title="Logout" data-bs-placement="bottom"></i>
                            <span class="d-md-none ms-2">Logout</span>
                        </a>
                    </li>
                    {% else %}
                    <li class="nav-item ms-2">
                        <a class="nav-link" href="{% url 'account_login' %}">
                            <i class="bi bi-door-open larger-icon" data-bs-toggle="tooltip" data-bs-title="Login" data-bs-placement="bottom"></i>
                            <span class="d-md-none ms-2">Login</span>
                        </a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>    
</header>
